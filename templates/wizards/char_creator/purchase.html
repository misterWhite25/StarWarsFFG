{{#if previewSpecialization}}<div class="wizard-specialization-choice">{{/if}}
<select name="purchase" id="ffgPurchase" {{#if previewSpecialization}}aria-label="{{localize 'SWFFG.CharacterCreator.buttons.specialization.select'}}"{{/if}}>
  <option value="">{{#if previewSpecialization}}{{localize "SWFFG.CharacterCreator.buttons.specialization.select"}}{{else}}{{localize "SWFFG.Actors.Sheets.Purchase.Dropdown" itemType=itemType}}{{/if}}</option>
  {{#each groups as |group| }}
    {{#if (eq ../itemCategory "forcepower") }}
      <optgroup label="{{ group }} {{ localize 'SWFFG.ForceRating' }}">
    {{else}}
        {{#if (eq ../itemCategory "specialization") }}
          <optgroup label="{{#if (eq group 'Universal')}}{{localize 'SWFFG.Spec.Universal'}}{{else if (eq group 'In Career')}}{{localize 'SWFFG.UI.Actor.InCareer'}}{{else if (eq group 'Out of Career')}}{{localize 'SWFFG.UI.Actor.OutOfCareer'}}{{else}}{{group}}{{/if}}">
        {{else}}
          <optgroup label="{{ group }}">
        {{/if}}
    {{/if}}
    <!-- force rating -->
    {{#each ../selectableItems as |data id|}}
      {{#if (eq data.requiredForceRating group) }}
        <option value="{{data.source}}" data-id="{{data.id}}" data-source="{{data.source}}" data-cost="{{data.cost}}">{{data.name}} ({{data.cost}} XP)</option>
      {{/if}}
    {{/each}}
    <!-- specialization -->
    {{#if (eq group "Universal") }}
      {{#each ../universal as |data id|}}
        <option value="{{data.source}}" data-source="{{data.source}}" data-cost="{{../../baseCost}}">{{data.name}} ({{../../baseCost}} XP)</option>
      {{/each}}
    {{/if}}
    {{#if (eq group "In Career") }}
      {{#each ../inCareer as |data id|}}
        <option value="{{data.source}}" data-source="{{data.source}}" data-cost="{{../../baseCost}}">{{data.name}} ({{../../baseCost}} XP)</option>
      {{/each}}
    {{/if}}
    {{#if (eq group "Out of Career") }}
      {{#each ../outCareer as |data id|}}
        <option value="{{data.source}}" data-source="{{data.source}}" data-cost="{{../../increasedCost}}">{{data.name}} ({{../../increasedCost}} XP)</option>
      {{/each}}
    {{/if}}
    </optgroup>
  {{/each }}
  {{#if (eq itemCategory "signatureability") }}
  {{#each selectableItems as |data id|}}
    <option value="{{id}}" data-id="{{id}}" data-source="{{data.source}}" data-cost="{{data.cost}}">{{data.name}} ({{data.cost}} XP)</option>
  {{/each}}
  {{/if}}
  <!-- talents -->
  {{#if (eq itemCategory "talent") }}
  {{#each selectableItems as |pack|}}
  <optgroup label="{{pack.pack}}">
  {{#each pack.items as |data id|}}
    <option value="{{id}}" data-id="{{id}}" data-source="{{data.source}}" data-cost="{{data.cost}}">{{data.name}} ({{data.cost}} XP)</option>
  {{/each}}
  </optgroup>
  {{/each}}
  {{/if}}
</select>
{{#if previewSpecialization}}
  <button type="button" class="wizard-preview-specialization" disabled>
    <i class="fa-solid fa-diagram-project" aria-hidden="true"></i>
    {{localize "SWFFG.CharacterCreator.buttons.specialization.preview"}}
  </button>
</div>
{{/if}}
